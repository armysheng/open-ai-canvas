# Copy to the host after issuing the certificate with webroot /var/www/letsencrypt.
server {
    listen 80;
    server_name movie.iaigc.fun;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://movie.iaigc.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name movie.iaigc.fun;
    ssl_certificate /etc/letsencrypt/live/movie.iaigc.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movie.iaigc.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1024m;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location ~ ^/api/(tasks/[^/]+/text-events|agent/runs/[^/]+/events|ai/system/[^/]+/(responses|chat/completions|models/[^/]+:streamGenerateContent))$ {
        proxy_pass http://127.0.0.1:13001;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:13001;
    }
}
